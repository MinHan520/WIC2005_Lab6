# mtu_a.yaml: fix A - every tenant's MTU lowered to 1450, underlay stays 1500 (1450 + 50 = 1500)
# Addresses: hypervisors get .1 .2 .3 .4 of the underlay; a tenant's VMs get .10 .11 .12 in order.
# MACs are 02:VV:VV:VV:00:XX (VNI in the middle, last byte of the IP at the end).

student_id_last4: "5016"

underlay:
  network: 10.16.0.0/24
  mtu: 1500

hypervisors: [hv1, hv2, hv3, hv4]

tenants:
  - name: shop                 # spans 3 hypervisors: shows flood-and-learn
    vni: 1601
    network: 10.16.60.0/24
    mtu: 1450
    vms:
      - [shop1, hv1]
      - [shop2, hv2]
      - [shop3, hv3]
  - name: bank                 # same addresses as shop on purpose, kept apart by VNI
    vni: 1602
    network: 10.16.60.0/24
    mtu: 1450
    vms:
      - [bank1, hv1]
      - [bank2, hv4]
  - name: dev                  # its own network, no overlap
    vni: 1603
    network: 10.16.70.0/24
    mtu: 1450
    vms:
      - [dev1, hv2]
      - [dev2, hv4]
